("""<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jan Kalyan Foundation — समाज सेवा</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f0e5;color:#202820}
header{position:sticky;top:0;background:#f5f0e5;padding:14px;text-align:center;border-bottom:1px solid #ddd;z-index:5}
.logo{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#315a42;color:#fff;border:3px solid #d7a441;font-weight:bold}
main{max-width:480px;margin:auto;padding:25px 18px 110px}
h1{font-size:32px}h1 span{color:#b84e2d}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.amount{padding:14px;text-align:center;background:#f1eadb;border:1px solid #ddd;border-radius:5px;font-weight:bold}
.amount.active{border:2px solid #b84e2d;color:#b84e2d}
input{width:100%;padding:12px;margin-top:10px;box-sizing:border-box}
button{width:100%;padding:15px;border:0;border-radius:6px;background:#b84e2d;color:white;font-weight:bold;font-size:16px;margin-top:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#f5f0e5;padding:12px;z-index:10}
</style>
</head>
<body>
<header><div class="logo">JKF</div><br><b>Jan Kalyan Foundation</b><br><small>समाज सेवा</small></header>
<main>
<h1>प्रभावित परिवारों तक <span>मदद पहुँचाएँ</span></h1>
<p>आपका सहयोग राहत कार्यों में सहायता कर सकता है।</p>
<div class="card"><b>योगदान की राशि चुनें</b>
<div class="amounts" style="margin-top:12px">
<div class="amount" data-a="51">₹51</div><div class="amount" data-a="101">₹101</div><div class="amount" data-a="501">₹501</div>
<div class="amount" data-a="1101">₹1,101</div><div class="amount" data-a="2100">₹2,100</div><div class="amount" data-a="5100">₹5,100</div>
</div><input id="custom" type="number" min="51" placeholder="अपनी राशि लिखें"></div>
</main>
<div class="bottom"><button id="next" disabled>आगे बढ़ें — QR कोड खोलें →</button></div>
<script>
let amount=0;
document.querySelectorAll(".amount").forEach(x=>x.onclick=()=>{amount=+x.dataset.a;document.querySelectorAll(".amount").forEach(y=>y.classList.remove("active"));x.classList.add("active");document.getElementById("next").disabled=false});
document.getElementById("custom").oninput=e=>{amount=+e.target.value||0;document.querySelectorAll(".amount").forEach(y=>y.classList.remove("active"));document.getElementById("next").disabled=amount<51};
document.getElementById("next").onclick=()=>alert("QR payment page के लिए अपनी UPI ID code में सेट करें।");
</script>
</body>
</html>""
